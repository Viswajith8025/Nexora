# A string used to distinguish different Supabase projects on the same host.
project_id = "nexora"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true

[functions.ingest-sources]
verify_jwt = false

[functions.process-articles]
verify_jwt = false

[functions.evaluate-articles]
verify_jwt = false

[functions.telegram-webhook]
verify_jwt = false

[functions.dispatch-morning-digest]
verify_jwt = false

[functions.dispatch-evening-digest]
verify_jwt = false

[functions.dispatch-weekly-digest]
verify_jwt = false

[functions.dispatch-breaking-alerts]
verify_jwt = false

[functions.gmail-oauth]
verify_jwt = false

[functions.system-health]
verify_jwt = true

